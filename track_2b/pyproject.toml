[project]
name = "clausus"
version = "0.1.0"
description = "Sovereign layer for confidential content: Apertus finds what is confidential, masks it, and keeps it in the house."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The hear service image installs these plus torch (CPU or CUDA build, see Dockerfile.hear).
hear = ["numpy>=1.26", "transformers>=5,<6", "protobuf>=4", "sentencepiece>=0.2", "tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clausus = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real Apertus endpoint (needs LLM_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
