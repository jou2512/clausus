services:
  clausus:
    build: .
    env_file: .env
    environment:
      CLAUSUS_HEAR_URL: http://hear:8000
      # Apertus judges finds only one model pass made (measured 08.10.2026: fewer needless
      # placeholders, no new leak). Set CLAUSUS_JUDGE=0 in .env to switch it off.
      CLAUSUS_JUDGE: ${CLAUSUS_JUDGE:-1}
    ports:
      # Host port is configurable in case 8080 is taken (CLAUSUS_PORT in .env).
      - "${CLAUSUS_PORT:-8080}:8080"
    volumes:
      - runs:/data/runs  # receipts survive restarts
    depends_on:
      - hear
    restart: unless-stopped

  hear:
    # Swiss German speech to text, local. CPU by default; `make run-gpu` uses the GPU.
    build:
      context: .
      dockerfile: Dockerfile.hear
    environment:
      HEAR_IDLE_UNLOAD_S: "${HEAR_IDLE_UNLOAD_S:-600}"
    volumes:
      - hf-cache:/models  # the ~3 GB model is downloaded once
    restart: unless-stopped

volumes:
  hf-cache:
  runs:
